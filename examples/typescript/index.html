<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP-Script Editor - TypeScript Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #252526;
            padding: 1rem;
            border-bottom: 1px solid #3c3c3c;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
        }

        .controls {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: #2d2d30;
            border-bottom: 1px solid #3c3c3c;
        }

        button {
            padding: 0.5rem 1rem;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        button:hover {
            background: #1177bb;
        }

        button.secondary {
            background: #3c3c3c;
        }

        button.secondary:hover {
            background: #4c4c4c;
        }

        #editor-container {
            flex: 1;
            overflow: hidden;
        }

        .status {
            padding: 0.5rem 1rem;
            background: #007acc;
            color: white;
            font-size: 0.875rem;
        }
    </style>

    <!-- Server-side configuration (in production, this would be generated by PHP) -->
    <script>
        window.phpScriptEditorConfig = {
            "languageDefinition": {
                "languageId": "php-script",
                "monarchDefinition": {
                    "tokenizer": {
                        "root": [
                            { "regex": "\\b(if|else|elseif|for|foreach|while|return|function|class|extends|implements|new|true|false|null)\\b", "action": "keyword" },
                            { "regex": "\\b\\w+\\(", "action": "function" },
                            { "regex": "\\b\\w+(\\.\\w+)+", "action": "variable.predefined" },
                            { "regex": "\"([^\"\\\\]|\\\\.)*\"", "action": "string" },
                            { "regex": "'([^'\\\\]|\\\\.)*'", "action": "string" },
                            { "regex": "\\/\\/.*$", "action": "comment" },
                            { "regex": "\\/\\*", "action": { "token": "comment", "next": "@comment" } },
                            { "regex": "\\b\\d+(\\.\\d+)?\\b", "action": "number" },
                            { "regex": "[+\\-*\\/=<>!&|]", "action": "operator" }
                        ],
                        "comment": [
                            { "regex": "\\*\\/", "action": { "token": "comment", "next": "@pop" } },
                            { "regex": ".", "action": "comment" }
                        ]
                    },
                    "keywords": ["if", "else", "elseif", "for", "foreach", "while", "return", "function", "class", "extends", "implements", "new", "true", "false", "null"],
                    "operators": ["+", "-", "*", "/", "=", "==", "!=", "<", ">", "<=", ">=", "&&", "||", "!"]
                },
                "fileExtensions": [".phs", ".phpscript"],
                "mimeTypes": ["text/x-php-script"],
                "configuration": {
                    "comments": {
                        "lineComment": "//",
                        "blockComment": ["/*", "*/"]
                    },
                    "brackets": [
                        ["[", "]"],
                        ["{", "}"],
                        ["(", ")"]
                    ],
                    "autoClosingPairs": [
                        { "open": "{", "close": "}" },
                        { "open": "[", "close": "]" },
                        { "open": "(", "close": ")" },
                        { "open": "\"", "close": "\"" },
                        { "open": "'", "close": "'" }
                    ],
                    "surroundingPairs": [
                        { "open": "{", "close": "}" },
                        { "open": "[", "close": "]" },
                        { "open": "(", "close": ")" },
                        { "open": "\"", "close": "\"" },
                        { "open": "'", "close": "'" }
                    ]
                }
            },
            "functionWhitelist": {
                "functions": [
                    {
                        "name": "strlen",
                        "signature": {
                            "parameters": [
                                { "name": "string", "type": "string", "optional": false }
                            ],
                            "returnType": "int"
                        },
                        "documentation": "Returns the length of the given string",
                        "category": "string"
                    },
                    {
                        "name": "substr",
                        "signature": {
                            "parameters": [
                                { "name": "string", "type": "string", "optional": false },
                                { "name": "start", "type": "int", "optional": false },
                                { "name": "length", "type": "int", "optional": true }
                            ],
                            "returnType": "string"
                        },
                        "documentation": "Returns a substring",
                        "category": "string"
                    },
                    {
                        "name": "date",
                        "signature": {
                            "parameters": [
                                { "name": "format", "type": "string", "optional": false },
                                { "name": "timestamp", "type": "int", "optional": true }
                            ],
                            "returnType": "string"
                        },
                        "documentation": "Format a local time/date",
                        "category": "date"
                    }
                ]
            },
            "contextSchema": {
                "variables": [
                    {
                        "name": "user",
                        "type": { "kind": "object", "baseType": "User" },
                        "properties": [
                            {
                                "name": "name",
                                "type": { "kind": "scalar", "baseType": "string" },
                                "documentation": "User full name"
                            },
                            {
                                "name": "email",
                                "type": { "kind": "scalar", "baseType": "string" },
                                "documentation": "User email address"
                            },
                            {
                                "name": "logins",
                                "type": { "kind": "object", "baseType": "LoginHistory" },
                                "properties": [
                                    {
                                        "name": "count",
                                        "type": { "kind": "scalar", "baseType": "int" },
                                        "documentation": "Total number of logins"
                                    },
                                    {
                                        "name": "lastLogin",
                                        "type": { "kind": "scalar", "baseType": "date" },
                                        "documentation": "Last login timestamp"
                                    }
                                ],
                                "documentation": "User login history"
                            }
                        ],
                        "documentation": "Current user object"
                    },
                    {
                        "name": "request",
                        "type": { "kind": "object", "baseType": "Request" },
                        "properties": [
                            {
                                "name": "method",
                                "type": { "kind": "scalar", "baseType": "string" },
                                "documentation": "HTTP method (GET, POST, etc.)"
                            },
                            {
                                "name": "path",
                                "type": { "kind": "scalar", "baseType": "string" },
                                "documentation": "Request URI path"
                            }
                        ],
                        "documentation": "HTTP request object"
                    }
                ]
            },
            "bundleVersion": "1.0.0",
            "compatibility": {
                "minEditorVersion": "1.0.0",
                "phpScriptEngine": "2.5.0"
            },
            "metadata": {
                "generatedAt": "2025-01-15T10:00:00Z",
                "generatedBy": "example-generator",
                "environment": "development"
            }
        };

        window.phpScriptInitialContent = "// Try typing 'user.' or 'request.' to see autocomplete\nuser.name";
    </script>
</head>
<body>
    <header>
        <h1>PHP-Script Editor - TypeScript Example</h1>
    </header>

    <div class="controls">
        <button id="getValue">Get Value</button>
        <button id="setValue" class="secondary">Set Sample Code</button>
        <button id="revert" class="secondary">Revert to Original</button>
        <button id="clearStorage" class="secondary">Clear localStorage</button>
        <button id="checkChanges" class="secondary">Check Unsaved Changes</button>
    </div>

    <div id="editor-container"></div>

    <div id="status" class="status"></div>

    <script type="module" src="./main.ts"></script>
</body>
</html>
