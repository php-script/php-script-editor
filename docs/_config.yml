title: PHP Script Editor
description: A Monaco-based web component for PHP Script, with React, Vue, Svelte, Laravel and Filament integrations.
theme: just-the-docs

url: https://php-script.github.io

defaults:
  - scope:
      path: ''
      type: pages
    values:
      layout: default

# Aux Links
aux_links:
  '📦': https://github.com/php-script/php-script-editor
  '📖 PHP Script': https://php-script.github.io/php-script/
aux_links_new_tab: true

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: 'k'

# Navigation
nav_enabled: true
heading_anchors: true

# Code blocks
enable_copy_code_button: true

# Footer
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: '%b %e %Y at %I:%M %p' # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html
gh_edit_link: true # show or hide edit this page link
gh_edit_link_text: 'Edit this page on GitHub.'
gh_edit_repository: 'https://github.com/php-script/php-script-editor' # the github URL for your repo
gh_edit_branch: 'main' # the branch that your docs is served from
gh_edit_source: 'docs' # the source that your files originate from
gh_edit_view_mode: 'tree' # "tree" or "edit" if you want the user to jump into the editor immediately

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
