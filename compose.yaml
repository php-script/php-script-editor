# Local dev and test environment. Works with Docker Desktop and OrbStack.
#
#   docker compose up                      # dev server (PHP :8080) + playground (:5173)
#   docker compose run --rm test           # vitest (unit + browser) and Playwright e2e
#   docker compose run --rm test-php       # Pest tests of packages/laravel and packages/filament
#   docker compose up -d laravel           # generated Laravel 13 + Filament 5 demo on :8000
#   docker compose run --rm test-laravel   # Playwright e2e against the demo
#
# node_modules and vendor live in named volumes, so host (macOS) and container (Linux)
# installs never clash.

x-node: &node
  image: php-script-editor-node
  build:
    context: ./docker
    dockerfile: node.Dockerfile
  entrypoint: ['/app/docker/node-entrypoint.sh']
  volumes:
    - .:/app
    - pnpm-store:/pnpm/store
    - node_modules:/app/node_modules
    - node_modules-editor:/app/packages/editor/node_modules
    - node_modules-react:/app/packages/react/node_modules
    - node_modules-vue:/app/packages/vue/node_modules
    - node_modules-svelte:/app/packages/svelte/node_modules
    - node_modules-playground:/app/playground/node_modules
  environment:
    PHP_SERVER: http://php:8080
  ipc: host

x-php: &php
  image: php-script-editor-php
  build:
    context: ./docker
    dockerfile: php.Dockerfile
  volumes:
    - .:/app
    - composer-cache:/composer
    - vendor-dev-server:/app/dev-server/vendor
    - vendor-laravel:/app/packages/laravel/vendor
    - vendor-filament:/app/packages/filament/vendor

services:
  php:
    <<: *php
    working_dir: /app/dev-server
    command: sh -c "composer install --no-interaction --no-progress && php -S 0.0.0.0:8080 -t public public/index.php"
    environment:
      SCRIPT_STORAGE: /app/dev-server/storage/docker
    ports:
      - '8080:8080'
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 60s

  playground:
    <<: *node
    command: pnpm --filter playground exec vite --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - '5173:5173'
    depends_on:
      php:
        condition: service_healthy
    # Vite only starts after the entrypoint's `pnpm build`, so healthy = editor dist built.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 100
      start_period: 300s

  # Laravel 13 + Filament 5 demo using packages/laravel and packages/filament (path repositories).
  # http://localhost:8000 (LARAVEL_PORT), http://laravel.php-script-editor.orb.local (OrbStack).
  # admin@example.com / password; /admin signs guests in automatically (DEMO_AUTO_LOGIN).
  laravel:
    <<: *php
    # Generates a Laravel 13 + Filament 5 app into the demo-laravel-app volume (first start only),
    # applies demo/laravel-overlay and serves it. Start over: docker compose rm -sf laravel &&
    # docker volume rm php-script-editor_demo-laravel-app
    working_dir: /srv
    command: sh /app/docker/laravel-setup.sh
    volumes:
      - .:/app
      - composer-cache:/composer
      - vendor-laravel:/app/packages/laravel/vendor
      - vendor-filament:/app/packages/filament/vendor
      - demo-laravel-app:/srv
    environment:
      PHP_CLI_SERVER_WORKERS: 8
    ports:
      - '${LARAVEL_PORT:-8000}:8000'
    depends_on:
      playground:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 180s

  test:
    <<: *node
    profiles: [test]
    command: sh -c "pnpm typecheck && pnpm -r --workspace-concurrency=1 --if-present test && pnpm test:e2e"
    depends_on:
      php:
        condition: service_healthy

  test-php:
    <<: *php
    profiles: [test]
    working_dir: /app/packages
    # Both packages; stale compiled testbench views break after dependency changes.
    command: >-
      sh -c 'set -e; for p in laravel filament; do
      echo "== packages/$$p"; cd /app/packages/$$p;
      composer install --no-interaction --no-progress;
      rm -f vendor/orchestra/testbench-core/laravel/storage/framework/views/*.php;
      composer test; done'

  test-laravel:
    <<: *node
    profiles: [test]
    entrypoint: []
    working_dir: /app/playground
    # node_modules are installed by the playground entrypoint (laravel depends on it).
    command: pnpm exec playwright test -c playwright.laravel.config.ts
    environment:
      LARAVEL_URL: http://laravel:8000
    depends_on:
      laravel:
        condition: service_healthy

volumes:
  pnpm-store:
  composer-cache:
  node_modules:
  node_modules-editor:
  node_modules-react:
  node_modules-vue:
  node_modules-svelte:
  node_modules-playground:
  vendor-dev-server:
  vendor-laravel:
  vendor-filament:
  demo-laravel-app:
