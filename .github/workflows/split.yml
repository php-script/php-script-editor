name: Split composer packages

# Mirrors the composer packages into read-only repositories for Packagist.
# A push to main updates dev-main. release.yml calls this with a version after publishing,
# because tags created with GITHUB_TOKEN do not trigger other workflows.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      SPLIT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag in the split repositories, e.g. 2.0.1 (empty = branch only)
        type: string
        required: false

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - { directory: packages/laravel, repository: editor-laravel }
          - { directory: packages/filament, repository: editor-filament }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: echo "tag=${VERSION:+v$VERSION}" >> "$GITHUB_OUTPUT"
      - uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          tag: ${{ steps.version.outputs.tag }}
          branch: main
          package_directory: ${{ matrix.package.directory }}
          repository_organization: php-script
          repository_name: ${{ matrix.package.repository }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
